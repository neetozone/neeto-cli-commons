version: v1.0

fail_fast: false

plan: pro

machine_type: multi

commands:
  - checkout
  - neetoci-version go 1.26
  - export GOPRIVATE=github.com/neetozone/*
  - git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
  - git config --global user.email "neeto-bot@bigbinary.com"
  - git config --global user.name "NeetoBot"
  - bash assets/bump.sh "$(cat VERSION | sed 's/^v*/v/')"

triggers:
  - event: tag
    tag_name: "v*"
